<text x="0" y="270" font-size="13" fill="#4fa87a" text-anchor="start" font-weight="600">▶ gemma4가 전 항목 1위. 일본어 문자 잔류는 2건으로 2위의 1/14.</text>
<text x="0" y="292" font-size="13" fill="#7d8590" text-anchor="start" font-weight="normal">▶ 세대가 크기를 이깁니다: qwen3.5:4b(3.4GB) > qwen3:8b(5.2GB), p=0.037.</text>
<text x="0" y="314" font-size="13" fill="#e0913a" text-anchor="start" font-weight="600">▶ 현재 기본값 qwen3:8b는 5개 중 4위 — 유지할 근거가 없습니다.</text>
<text x="0" y="338" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal">* gemma4만 Ollama 0.32.7, 나머지는 0.18.2에서 측정 (한 버전에서 둘 다 못 돌림).</text>
<text x="0" y="356" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal">  속도는 이 때문에 비교 불가. 품질 지표도 런타임 영향 가능성을 배제할 수 없음.</text>
